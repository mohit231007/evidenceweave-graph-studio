name: Hybrid quality patch

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Pin model and gate broad community fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/lib/hybrid.ts')
          text = p.read_text()

          old = 'export const HYBRID_RETRIEVAL_VERSION = "bm25-inverted+vector-worker+graph-rrf-v2";\n'
          new = old + 'export const DEFAULT_EMBEDDING_MODEL_ID = "Xenova/all-MiniLM-L6-v2";\nexport const DEFAULT_EMBEDDING_MODEL_REVISION = "751bff37182d3f1213fa05d7196b954e230abad9";\n'
          if old not in text: raise SystemExit('retrieval version marker missing')
          text = text.replace(old, new, 1)

          old = '  const queryTerms = new Set(tokenizeRetrieval(query));\n  const communities = graphCommunities(entities, relations);\n'
          new = '  const queryTerms = new Set(tokenizeRetrieval(query));\n  const broadIntent = /\\b(?:overall|overview|summari[sz]e|themes?|communities|clusters?|landscape|big picture)\\b/i.test(query);\n  const communities = graphCommunities(entities, relations);\n'
          if old not in text: raise SystemExit('community query marker missing')
          text = text.replace(old, new, 1)

          old = '    const score = lexicalMatches ? Math.min(1, 0.55 + lexicalMatches * 0.12 + breadth * 0.2) : Math.max(0.15, breadth * (1 - communityIndex * 0.08));\n    for (const id of community)'
          new = '    const score = lexicalMatches ? Math.min(1, 0.55 + lexicalMatches * 0.12 + breadth * 0.2) : broadIntent ? Math.max(0.15, breadth * (1 - communityIndex * 0.08)) : 0;\n    if (!score) return;\n    for (const id of community)'
          if old not in text: raise SystemExit('community score marker missing')
          text = text.replace(old, new, 1)

          old = 'async function createDirectTransformersProvider(modelId: string): Promise<EmbeddingProvider> {'
          new = 'async function createDirectTransformersProvider(modelId: string, revision: string): Promise<EmbeddingProvider> {'
          if old not in text: raise SystemExit('direct provider marker missing')
          text = text.replace(old, new, 1)
          old = '  const extractor = await pipeline("feature-extraction", modelId, { device: supportsWebGpu ? "webgpu" : "wasm", dtype: "q8" });'
          new = '  const extractor = await pipeline("feature-extraction", modelId, { device: supportsWebGpu ? "webgpu" : "wasm", dtype: "q8", revision });'
          if old not in text: raise SystemExit('direct pipeline marker missing')
          text = text.replace(old, new, 1)
          old = '    version: "transformers.js-4.2.0",\n'
          new = '    version: `transformers.js-4.2.0@${revision}`,\n'
          if old not in text: raise SystemExit('direct version marker missing')
          text = text.replace(old, new, 1)

          old = 'async function createWorkerTransformersProvider(modelId: string): Promise<EmbeddingProvider> {'
          new = 'async function createWorkerTransformersProvider(modelId: string, revision: string): Promise<EmbeddingProvider> {'
          if old not in text: raise SystemExit('worker provider marker missing')
          text = text.replace(old, new, 1)
          old = '  worker.postMessage({ type: "init", modelId });\n'
          new = '  worker.postMessage({ type: "init", modelId, revision });\n'
          if old not in text: raise SystemExit('worker init marker missing')
          text = text.replace(old, new, 1)
          old = '    version: "transformers.js-4.2.0-worker-v1",\n'
          new = '    version: `transformers.js-4.2.0-worker-v1@${revision}`,\n'
          if old not in text: raise SystemExit('worker version marker missing')
          text = text.replace(old, new, 1)

          old = 'export async function createTransformersProvider(modelId = "Xenova/all-MiniLM-L6-v2"): Promise<EmbeddingProvider> {\n  if (typeof Worker !== "undefined") {\n    try { return await createWorkerTransformersProvider(modelId); }\n    catch { /* fall through to direct WASM/WebGPU provider */ }\n  }\n  return createDirectTransformersProvider(modelId);\n}\n'
          new = 'export async function createTransformersProvider(modelId = DEFAULT_EMBEDDING_MODEL_ID, revision = DEFAULT_EMBEDDING_MODEL_REVISION): Promise<EmbeddingProvider> {\n  if (typeof Worker !== "undefined") {\n    try { return await createWorkerTransformersProvider(modelId, revision); }\n    catch { /* fall through to direct WASM/WebGPU provider */ }\n  }\n  return createDirectTransformersProvider(modelId, revision);\n}\n'
          if old not in text: raise SystemExit('public provider marker missing')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Commit quality patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/hybrid.ts
          git commit -m "feat: pin embedding revision and suppress ungrounded community noise"
          git push origin HEAD:feat/v1-completion-hardening

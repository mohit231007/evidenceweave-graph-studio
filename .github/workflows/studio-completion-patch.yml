name: Studio completion patch

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Wire completion features into Studio
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source fragment missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'apps/web/src/lib/documents.ts',
              '''export async function ingestFile(file: File, options: DocumentIngestOptions = {}): Promise<DocumentImportBundle> {\n  throwIfAborted(options.signal);\n  return ingestBytes(file.name, file.type || "application/octet-stream", await file.arrayBuffer(), options);\n}\n''',
              '''export async function ingestFile(file: File, options: DocumentIngestOptions = {}): Promise<DocumentImportBundle> {\n  throwIfAborted(options.signal);\n  if (typeof Worker === "undefined") return ingestBytes(file.name, file.type || "application/octet-stream", await file.arrayBuffer(), options);\n  const buffer = await file.arrayBuffer();\n  throwIfAborted(options.signal);\n  const jobId = crypto.randomUUID();\n  return new Promise<DocumentImportBundle>((resolve, reject) => {\n    const worker = new Worker(new URL("./document-import.worker.ts", import.meta.url), { type: "module", name: `evidenceweave-import-${jobId}` });\n    let settled = false;\n    const cleanup = () => {\n      worker.terminate();\n      options.signal?.removeEventListener("abort", onAbort);\n    };\n    const finish = (callback: () => void) => { if (settled) return; settled = true; cleanup(); callback(); };\n    const onAbort = () => {\n      worker.postMessage({ type: "cancel", jobId });\n      finish(() => reject(new DOMException("Document import cancelled.", "AbortError")));\n    };\n    options.signal?.addEventListener("abort", onAbort, { once: true });\n    worker.onmessage = (event: MessageEvent<{ type: string; jobId: string; progress?: DocumentImportProgress; bundle?: DocumentImportBundle; error?: string }>) => {\n      const message = event.data;\n      if (message.jobId !== jobId) return;\n      if (message.type === "progress" && message.progress) { options.onProgress?.(message.progress); return; }\n      if (message.type === "complete" && message.bundle) { finish(() => resolve(message.bundle!)); return; }\n      if (message.type === "cancelled") { finish(() => reject(new DOMException("Document import cancelled.", "AbortError"))); return; }\n      if (message.type === "error") finish(() => reject(new Error(message.error || "Document import failed.")));\n    };\n    worker.onerror = (event) => finish(() => reject(new Error(event.message || "Document import worker failed.")));\n    worker.postMessage({ type: "start", jobId, name: file.name, mimeType: file.type || "application/octet-stream", buffer }, [buffer]);\n  });\n}\n'''
          )

          app = 'apps/web/src/StudioV2App.tsx'
          replace(app, 'import { useEffect, useMemo, useRef, useState } from "react";\n', 'import { useEffect, useMemo, useRef, useState } from "react";\nimport WorkspaceTools from "./WorkspaceTools";\n')
          replace(app, '} from "./lib/review";\n', '} from "./lib/review";\nimport { undoReviewAudit } from "./lib/review-undo";\nimport { loadWorkspaceState, saveWorkspaceState, touchRecentNote } from "./lib/workspace-state";\n')
          replace(app, '''  useEffect(() => {\n    void seedIfEmpty().then(() => refresh());\n  }, []);\n''', '''  useEffect(() => {\n    void seedIfEmpty().then(async () => {\n      const saved = await loadWorkspaceState();\n      await refresh(saved.activeNoteId);\n      const validViews: MainView[] = ["workspace", "documents", "graph", "review", "evidence", "canvas", "library"];\n      if (validViews.includes(saved.activeView as MainView)) setView(saved.activeView as MainView);\n    });\n  }, []);\n\n  useEffect(() => {\n    void saveWorkspaceState({ activeView: view, activeNoteId: selectedId || undefined });\n  }, [view, selectedId]);\n''')
          replace(app, '''  const openNote = (id: string) => {\n    if (!notes.some((note) => note.id === id)) return;\n    setSelectedId(id);\n    setView("workspace");\n  };\n''', '''  const openNote = (id: string) => {\n    if (!notes.some((note) => note.id === id)) return;\n    setSelectedId(id);\n    setView("workspace");\n    void loadWorkspaceState().then((current) => knowledgeDb.workspaceState.put(touchRecentNote(current, id)));\n  };\n''')
          replace(app, '        <div className="sidebar-footer">\n', '        <WorkspaceTools notes={notes} createNote={createNote} openNote={openNote} onChanged={refresh} />\n        <div className="sidebar-footer">\n')
          replace(app, 'Export portable v2', 'Export portable v3')
          replace(app, 'Restore portable v1/v2', 'Restore portable v1/v2/v3')
          replace(app, 'evidenceweave-v2-', 'evidenceweave-v3-')
          replace(app, 'Restored portable v2 workspace:', 'Restored portable v3 workspace:')

          marker = '''  const splitReviewedEntity = async (entity: EntityCandidateRecord) => {\n    if (entity.evidenceBlockIds.length < 2) {\n      setStatus("This entity has only one evidence block, so there is nothing safe to split.");\n      return;\n    }\n    const desired = prompt("Name for the new split entity")?.trim();\n    if (!desired) return;\n    await splitEntity(entity, desired, [entity.evidenceBlockIds[0]]);\n    await refresh();\n    setStatus(`Split one evidence observation from “${entity.canonicalName}” into pending entity “${desired}”.`);\n  };\n'''
          replace(app, marker, marker + '''\n  const undoAuditAction = async (auditId: string) => {\n    try {\n      await undoReviewAudit(auditId);\n      await refresh();\n      setStatus("Reversed the selected review mutation from its audited before-snapshot.");\n    } catch (error) {\n      setStatus(error instanceof Error ? error.message : "Audit undo failed.");\n    }\n  };\n''')
          replace(app, 'splitEntity={splitReviewedEntity} />', 'splitEntity={splitReviewedEntity} undoAudit={undoAuditAction} />')
          replace(app, 'function ReviewView({ entities, relations, blocks, audit, rebuild, reviewEntity, reviewRelation, renameEntity: renameEntityAction, togglePin, mergeEntity, splitEntity: splitEntityAction }: {', 'function ReviewView({ entities, relations, blocks, audit, rebuild, reviewEntity, reviewRelation, renameEntity: renameEntityAction, togglePin, mergeEntity, splitEntity: splitEntityAction, undoAudit }: {')
          replace(app, '  splitEntity: (entity: EntityCandidateRecord) => Promise<void>;\n}) {', '  splitEntity: (entity: EntityCandidateRecord) => Promise<void>;\n  undoAudit: (id: string) => Promise<void>;\n}) {')
          replace(app, '''<div className="audit-list">{audit.slice(0, 20).map((item) => <div className="audit-row" key={item.id}><strong>{item.action}</strong><span>{item.targetKind} · {item.targetId.slice(0, 28)}</span><time>{new Date(item.createdAt).toLocaleString()}</time></div>)}</div>''', '''<div className="audit-list">{audit.slice(0, 20).map((item) => <div className="audit-row" key={item.id}><strong>{item.action}</strong><span>{item.targetKind} · {item.targetId.slice(0, 28)}</span><time>{new Date(item.createdAt).toLocaleString()}</time>{item.action !== "undo" && item.beforeJson && <button onClick={() => void undoAudit(item.id)}>Undo</button>}</div>)}</div>''')
          PY
      - name: Commit Studio wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/documents.ts apps/web/src/StudioV2App.tsx
          git commit -m "feat: wire worker imports workspace state and review undo into Studio"
          git push origin HEAD:feat/v1-completion-hardening

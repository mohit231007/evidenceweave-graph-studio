name: Final browser durability fix

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Persist primary navigation before rendering and stabilize relation review test
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/web/src/StudioV2App.tsx')
          text = app.read_text()
          old = '''  const openNote = (id: string) => {\n    if (!notes.some((note) => note.id === id)) return;\n    setSelectedId(id);\n    setView("workspace");\n    void loadWorkspaceState().then((current) => knowledgeDb.workspaceState.put(touchRecentNote(current, id)));\n  };\n\n  return (\n'''
          new = '''  const openNote = (id: string) => {\n    if (!notes.some((note) => note.id === id)) return;\n    setSelectedId(id);\n    setView("workspace");\n    void loadWorkspaceState().then((current) => knowledgeDb.workspaceState.put(touchRecentNote(current, id)));\n  };\n\n  const switchView = async (nextView: MainView) => {\n    if (workspaceHydrated.current) {\n      await saveWorkspaceState({ activeView: nextView, activeNoteId: selectedId || undefined });\n    }\n    setView(nextView);\n  };\n\n  return (\n'''
          if old not in text: raise SystemExit('openNote marker missing')
          text = text.replace(old, new, 1)
          old = 'onClick={() => setView(item)}'
          new = 'onClick={() => void switchView(item)}'
          if old not in text: raise SystemExit('navigation marker missing')
          app.write_text(text.replace(old, new, 1))

          spec = Path('apps/web/e2e/studio.spec.ts')
          text = spec.read_text()
          old = '''  const firstAccept = entitySection.getByRole("button", { name: "Accept", exact: true }).first();\n  await expect(firstAccept).toBeVisible();\n  while (await entitySection.getByRole("button", { name: "Accept", exact: true }).count()) {\n    await entitySection.getByRole("button", { name: "Accept", exact: true }).first().click();\n  }\n  const relationAccept = relationSection.getByRole("button", { name: "Accept", exact: true }).first();\n'''
          new = '''  for (const endpoint of ["Microsoft", "GitHub"]) {\n    const card = entitySection.locator(".review-card").filter({ hasText: endpoint }).first();\n    await expect(card).toBeVisible();\n    await card.getByRole("button", { name: "Accept", exact: true }).click();\n  }\n  const relationAccept = relationSection.locator(".review-card").filter({ hasText: "acquired" }).first().getByRole("button", { name: "Accept", exact: true });\n'''
          if old not in text: raise SystemExit('relation review test marker missing')
          spec.write_text(text.replace(old, new, 1))
          PY
      - name: Commit browser durability fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/StudioV2App.tsx apps/web/e2e/studio.spec.ts
          git commit -m "fix: make primary view navigation durable before render"
          git push origin HEAD:feat/v1-completion-hardening

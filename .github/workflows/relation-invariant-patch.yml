name: Relation invariant patch

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Enforce reviewed endpoint invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/lib/review.ts')
          text = p.read_text()
          old = '''export async function reviewRelation(record: RelationCandidateRecord, nextStatus: ReviewStatus): Promise<RelationCandidateRecord> {\n  const updated = { ...record, status: nextStatus, updatedAt: now() };\n  const action: ReviewAuditRecord["action"] = nextStatus === "accepted" ? "accept" : nextStatus === "rejected" ? "reject" : "reopen";\n  await knowledgeDb.transaction("rw", [knowledgeDb.relations, knowledgeDb.reviewAudit], async () => {\n    await knowledgeDb.relations.put(updated);\n    await knowledgeDb.reviewAudit.add(auditFor(record, "relation", action, record.status, nextStatus, JSON.stringify(record), JSON.stringify(updated)));\n  });\n  return updated;\n}\n'''
          new = '''export async function reviewRelation(record: RelationCandidateRecord, nextStatus: ReviewStatus): Promise<RelationCandidateRecord> {\n  if (nextStatus === "accepted") {\n    if (!record.evidenceBlockIds.length) throw new Error("A relationship cannot be accepted without source-block provenance.");\n    const [source, target] = await Promise.all([\n      knowledgeDb.entities.get(record.sourceEntityId),\n      knowledgeDb.entities.get(record.targetEntityId)\n    ]);\n    if (!source || !target) throw new Error("A relationship cannot be accepted when an endpoint entity is missing.");\n    if (source.status !== "accepted" || target.status !== "accepted" || source.mergedIntoId || target.mergedIntoId) {\n      throw new Error("Accept both endpoint entities before accepting this relationship.");\n    }\n  }\n  const updated = { ...record, status: nextStatus, updatedAt: now() };\n  const action: ReviewAuditRecord["action"] = nextStatus === "accepted" ? "accept" : nextStatus === "rejected" ? "reject" : "reopen";\n  await knowledgeDb.transaction("rw", [knowledgeDb.relations, knowledgeDb.reviewAudit], async () => {\n    await knowledgeDb.relations.put(updated);\n    await knowledgeDb.reviewAudit.add(auditFor(record, "relation", action, record.status, nextStatus, JSON.stringify(record), JSON.stringify(updated)));\n  });\n  return updated;\n}\n'''
          if old not in text: raise SystemExit('reviewRelation marker missing')
          p.write_text(text.replace(old, new, 1))

          e2e = Path('apps/web/e2e/studio.spec.ts')
          text = e2e.read_text()
          old = '''  const firstAccept = entitySection.getByRole("button", { name: "Accept", exact: true }).first();\n  await expect(firstAccept).toBeVisible();\n  await firstAccept.click();\n  const relationAccept = relationSection.getByRole("button", { name: "Accept", exact: true }).first();\n'''
          new = '''  const firstAccept = entitySection.getByRole("button", { name: "Accept", exact: true }).first();\n  await expect(firstAccept).toBeVisible();\n  while (await entitySection.getByRole("button", { name: "Accept", exact: true }).count()) {\n    await entitySection.getByRole("button", { name: "Accept", exact: true }).first().click();\n  }\n  const relationAccept = relationSection.getByRole("button", { name: "Accept", exact: true }).first();\n'''
          if old not in text: raise SystemExit('e2e accept marker missing')
          e2e.write_text(text.replace(old, new, 1))
          PY
      - name: Commit invariant patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/review.ts apps/web/e2e/studio.spec.ts
          git commit -m "fix: require accepted endpoints before accepting relations"
          git push origin HEAD:feat/v1-completion-hardening

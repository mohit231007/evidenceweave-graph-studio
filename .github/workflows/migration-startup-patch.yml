name: Migration startup patch

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Wire automatic recoverable workspace migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/StudioV2App.tsx')
          text = p.read_text()
          old = 'import { loadWorkspaceState, saveWorkspaceState, touchRecentNote } from "./lib/workspace-state";'
          new = 'import { ensureWorkspaceSchema, loadWorkspaceState, saveWorkspaceState, touchRecentNote } from "./lib/workspace-state";'
          if old not in text: raise SystemExit('workspace-state import marker missing')
          text = text.replace(old, new, 1)
          old = '''    void seedIfEmpty().then(async () => {\n      const saved = await loadWorkspaceState();\n      await refresh(saved.activeNoteId);\n'''
          new = '''    void seedIfEmpty().then(async () => {\n      await ensureWorkspaceSchema(await db.notes.toArray());\n      const saved = await loadWorkspaceState();\n      await refresh(saved.activeNoteId);\n'''
          if old not in text: raise SystemExit('startup marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit migration startup wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/StudioV2App.tsx
          git commit -m "feat: run recoverable workspace schema migration on startup"
          git push origin HEAD:feat/v1-completion-hardening

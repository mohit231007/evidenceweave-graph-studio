name: Release controls patch

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Wire review controls and document canvas nodes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/StudioV2App.tsx')
          text = p.read_text()
          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing marker: {old[:120]!r}')
              text = text.replace(old, new, 1)

          rep('  setEntityPinned,\n  splitEntity\n} from "./lib/review";', '  setEntityPinned,\n  setRelationValidity,\n  splitEntity\n} from "./lib/review";')

          marker = '''  const reviewRelation = async (relation: RelationCandidateRecord, accepted: boolean) => {\n    await persistRelationReview(relation, accepted ? "accepted" : "rejected");\n    await refresh();\n  };\n'''
          insert = marker + '''\n  const reopenReviewedEntity = async (entity: EntityCandidateRecord) => {\n    await persistEntityReview(entity, "pending");\n    await refresh();\n    setStatus(`Reopened “${entity.canonicalName}” for review.`);\n  };\n\n  const reopenReviewedRelation = async (relation: RelationCandidateRecord) => {\n    await persistRelationReview(relation, "pending");\n    await refresh();\n    setStatus(`Reopened relationship “${relation.relation}” for review.`);\n  };\n\n  const editRelationValidity = async (relation: RelationCandidateRecord) => {\n    const validFrom = prompt("Relationship valid from (ISO date, blank for unknown)", relation.validFrom ?? "");\n    if (validFrom === null) return;\n    const validTo = prompt("Relationship valid to (ISO date, blank for open-ended/unknown)", relation.validTo ?? "");\n    if (validTo === null) return;\n    try {\n      await setRelationValidity(relation, validFrom, validTo);\n      await refresh();\n      setStatus("Updated reviewed relationship validity with an auditable before/after snapshot.");\n    } catch (error) {\n      setStatus(error instanceof Error ? error.message : "Relationship validity update failed.");\n    }\n  };\n'''
          rep(marker, insert)

          old_call = 'reviewEntity={reviewEntity} reviewRelation={reviewRelation} renameEntity={renameReviewedEntity} togglePin={togglePin}'
          new_call = 'reviewEntity={reviewEntity} reviewRelation={reviewRelation} reopenEntity={reopenReviewedEntity} reopenRelation={reopenReviewedRelation} editRelationValidity={editRelationValidity} renameEntity={renameReviewedEntity} togglePin={togglePin}'
          rep(old_call, new_call)

          rep('function ReviewView({ entities, relations, blocks, audit, rebuild, reviewEntity, reviewRelation, renameEntity: renameEntityAction, togglePin, mergeEntity, splitEntity: splitEntityAction, undoAudit, runLocalNer, buildSemanticSuggestions, semanticSuggestions, reviewSemanticSuggestion }: {', 'function ReviewView({ entities, relations, blocks, audit, rebuild, reviewEntity, reviewRelation, reopenEntity, reopenRelation, editRelationValidity, renameEntity: renameEntityAction, togglePin, mergeEntity, splitEntity: splitEntityAction, undoAudit, runLocalNer, buildSemanticSuggestions, semanticSuggestions, reviewSemanticSuggestion }: {')
          rep('  reviewRelation: (relation: RelationCandidateRecord, accepted: boolean) => Promise<void>;\n', '  reviewRelation: (relation: RelationCandidateRecord, accepted: boolean) => Promise<void>;\n  reopenEntity: (entity: EntityCandidateRecord) => Promise<void>;\n  reopenRelation: (relation: RelationCandidateRecord) => Promise<void>;\n  editRelationValidity: (relation: RelationCandidateRecord) => Promise<void>;\n')
          rep('{entity.status === "pending" && <><button onClick={() => void reviewEntity(entity, true)}>Accept</button><button onClick={() => void reviewEntity(entity, false)}>Reject</button></>}', '{entity.status === "pending" ? <><button onClick={() => void reviewEntity(entity, true)}>Accept</button><button onClick={() => void reviewEntity(entity, false)}>Reject</button></> : <button onClick={() => void reopenEntity(entity)}>Reopen</button>}')
          rep('<p>{relation.evidenceBlockIds.map((id) => blockMap.get(id)?.title).filter(Boolean).slice(0, 3).join(" · ")} · {Math.round(relation.confidence * 100)}% · {relation.status}</p>\n              {relation.status === "pending" && <div className="review-actions"><button onClick={() => void reviewRelation(relation, true)}>Accept</button><button onClick={() => void reviewRelation(relation, false)}>Reject</button></div>}', '<p>{relation.evidenceBlockIds.map((id) => blockMap.get(id)?.title).filter(Boolean).slice(0, 3).join(" · ")} · {Math.round(relation.confidence * 100)}% · {relation.status}{relation.validFrom || relation.validTo ? ` · validity ${relation.validFrom ?? "…"} → ${relation.validTo ?? "…"}` : ""}</p>\n              <div className="review-actions wrap-actions">{relation.status === "pending" ? <><button onClick={() => void reviewRelation(relation, true)}>Accept</button><button onClick={() => void reviewRelation(relation, false)}>Reject</button></> : <button onClick={() => void reopenRelation(relation)}>Reopen</button>}<button onClick={() => void editRelationValidity(relation)}>Edit validity</button></div>')
          rep('<small>{hop.evidenceBlockIds.map((id) => blockMap.get(id)?.title ?? id).join(" · ")}</small>', '<small>accepted inferred · {hop.evidenceBlockIds.map((id) => blockMap.get(id)?.title ?? id).join(" · ")}</small>')

          rep('{view === "canvas" && <CanvasStudio canvases={canvases} notes={notes} selected={selected} refresh={refresh} />}', '{view === "canvas" && <CanvasStudio canvases={canvases} notes={notes} documents={documents} selected={selected} refresh={refresh} />}')
          rep('function CanvasStudio({ canvases, notes, selected, refresh }: {\n  canvases: CanvasRecord[];\n  notes: NoteRecord[];\n  selected?: NoteRecord;', 'function CanvasStudio({ canvases, notes, documents, selected, refresh }: {\n  canvases: CanvasRecord[];\n  notes: NoteRecord[];\n  documents: SourceDocumentRecord[];\n  selected?: NoteRecord;')

          marker = '''  const addLabel = async () => {\n'''
          add_doc = '''  const addLatestDocument = async () => {\n    const document = documents[0];\n    if (!document) return;\n    let current = canvas;\n    if (!current) {\n      current = createCanvas();\n      await knowledgeDb.canvases.put(current);\n      setActiveId(current.id);\n    }\n    const next = addCanvasNode(current, { kind: "document", refId: document.id, label: document.name, x: 110 + current.nodes.length * 35, y: 100 + current.nodes.length * 25, width: 210, height: 90 });\n    await knowledgeDb.canvases.put(next);\n    await refresh();\n  };\n\n'''
          rep(marker, add_doc + marker)
          rep('<button className="primary" onClick={() => void addSelected()} disabled={!selected}>Add current note</button><button onClick={() => void addLabel()} disabled={!canvas}>Add label</button>', '<button className="primary" onClick={() => void addSelected()} disabled={!selected}>Add current note</button><button onClick={() => void addLatestDocument()} disabled={!documents.length}>Add latest document</button><button onClick={() => void addLabel()} disabled={!canvas}>Add label</button>')
          rep('{node.refId && notes.some((note) => note.id === node.refId) ? " · linked" : ""}', '{node.refId && (notes.some((note) => note.id === node.refId) || documents.some((document) => document.id === node.refId)) ? " · linked" : ""}')
          p.write_text(text)
          PY
      - name: Commit release controls
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/StudioV2App.tsx
          git commit -m "feat: expose reopen validity and document canvas controls"
          git push origin HEAD:feat/v1-completion-hardening

name: Commit pnpm lockfile

on:
  push:
    branches: [feat/v1-hardening-reasoning-workspace]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore: commit generated lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-hardening-reasoning-workspace
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit generated lockfile"
          git push origin HEAD:feat/v1-hardening-reasoning-workspace

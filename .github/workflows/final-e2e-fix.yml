name: Final E2E state fix

on:
  push:
    branches: [feat/v1-completion-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v1-completion-hardening
      - name: Fix recent state and browser assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/web/src/StudioV2App.tsx')
          text = app.read_text()
          old = '''    await db.notes.add(note);\n    await refresh(id);\n    setView("workspace");\n    setMode("edit");\n'''
          new = '''    await db.notes.add(note);\n    const workspaceState = touchRecentNote(await loadWorkspaceState(), id);\n    await knowledgeDb.workspaceState.put({ ...workspaceState, activeView: "workspace" });\n    await refresh(id);\n    setView("workspace");\n    setMode("edit");\n'''
          if old not in text: raise SystemExit('createNote marker missing')
          text = text.replace(old, new, 1)
          old = '''    if (existing) {\n      setSelectedId(existing.id);\n      setView("workspace");\n      return;\n    }\n'''
          new = '''    if (existing) {\n      setSelectedId(existing.id);\n      setView("workspace");\n      const workspaceState = touchRecentNote(await loadWorkspaceState(), existing.id);\n      await knowledgeDb.workspaceState.put({ ...workspaceState, activeView: "workspace" });\n      return;\n    }\n'''
          if old not in text: raise SystemExit('createDaily existing marker missing')
          text = text.replace(old, new, 1)
          app.write_text(text)

          spec = Path('apps/web/e2e/studio.spec.ts')
          text = spec.read_text()
          text = text.replace('getByRole("button", { name: "Rebuild candidates", exact: true })', 'getByRole("button", { name: "Rebuild deterministic", exact: true })', 1)
          old = '''  await expect(page.locator(".audit-row").first()).toContainText("accept");\n  await expect(page.locator(".audit-row").first().getByRole("button", { name: "Undo", exact: true })).toBeVisible();\n\n  await navButton(page, "Evidence").click();\n'''
          new = '''  await expect(page.locator(".audit-row").first()).toContainText("accept");\n  const undo = page.locator(".audit-row").first().getByRole("button", { name: "Undo", exact: true });\n  await expect(undo).toBeVisible();\n  await undo.click();\n  await expect(page.locator(".audit-row").first()).toContainText("undo");\n  await page.getByRole("button", { name: "Pending", exact: true }).click();\n  await expect(page.locator(".review-card").first()).toContainText("pending");\n\n  await navButton(page, "Evidence").click();\n'''
          if old not in text: raise SystemExit('undo E2E marker missing')
          text = text.replace(old, new, 1)
          spec.write_text(text)
          PY
      - name: Commit final state fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "EvidenceWeave CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/StudioV2App.tsx apps/web/e2e/studio.spec.ts
          git commit -m "fix: persist recent note state and verify review undo in browser"
          git push origin HEAD:feat/v1-completion-hardening
